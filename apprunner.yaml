version: 1.0
runtime: python3
build:
  commands:
    build:
      - echo "Installing dependencies"
      - pip install -r requirements.txt
run:
  runtime-version: 3.11
  command: gunicorn --bind 0.0.0.0:8080 --workers 2 app:app
  network:
    port: 8080
  env:
    - name: FLASK_ENV
      value: production
    - name: FLASK_DEBUG
      value: "0"